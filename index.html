<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的专属视频收藏站</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #1a1a1a;
            color: #fff;
            padding: 20px;
        }
        h1, h2 {
            margin-bottom: 20px;
            color: #ff4757;
        }
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .video-card {
            background: #2d2d2d;
            border-radius: 8px;
            overflow: hidden;
            padding: 10px;
        }
        .video-card h3 {
            font-size: 14px;
            margin: 10px 0;
        }
        .collect-btn {
            background: #ff4757;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }
        .collect-btn.collected {
            background: #2ed573;
        }
        .collection-list {
            background: #2d2d2d;
            border-radius: 8px;
            padding: 20px;
        }
        .collection-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #444;
        }
        .collection-item:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>
    <h1>我的视频站（无限收藏版）</h1>

    <div class="video-grid" id="video-list">
        <!-- 这里可以放你喜欢的视频，我先给你放几个示例 -->
        <div class="video-card">
            <h3>示例视频：电影A</h3>
            <button class="collect-btn" data-id="movieA">收藏</button>
        </div>
        <div class="video-card">
            <h3>示例视频：综艺B</h3>
            <button class="collect-btn" data-id="showB">收藏</button>
        </div>
        <div class="video-card">
            <h3>示例视频：动漫C</h3>
            <button class="collect-btn" data-id="animeC">收藏</button>
        </div>
    </div>

    <h2>我的无限收藏夹（无数量限制）</h2>
    <div class="collection-list" id="collection-list"></div>

    <script src="script.js"></script>
</body>
</html>
