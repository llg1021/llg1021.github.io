<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的私人视频收藏站</title>
    <!-- 引入hls.js，支持播放m3u8视频流 -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }

        body {
            display: flex;
            background-color: #1a1a1a;
            color: #fff;
            height: 100vh;
        }

        /* 左侧分类栏 */
        .sidebar {
            width: 180px;
            background-color: #222;
            padding: 20px 0;
            border-right: 1px solid #333;
        }

        .sidebar h2 {
            color: #00a4ff;
            text-align: center;
            margin-bottom: 30px;
            font-size: 20px;
        }

        .category-list {
            list-style: none;
        }

        .category-list li {
            padding: 12px 25px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .category-list li:hover,
        .category-list li.active {
            background-color: #333;
            color: #00a4ff;
        }

        /* 右侧主内容区 */
        .main-content {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
        }

        /* 添加视频表单 */
        .add-video-form {
            background-color: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 25px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .add-video-form input,
        .add-video-form select,
        .add-video-form button {
            padding: 8px 12px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
        }

        .add-video-form button {
            background-color: #00a4ff;
            color: #fff;
            cursor: pointer;
        }

        .main-content h3 {
            margin-bottom: 20px;
            font-size: 18px;
            color: #fff;
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .video-card {
            background-color: #2a2a2a;
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.3s;
        }

        .video-thumbnail {
            width: 100%;
            height: 130px;
            background-color: #444;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #888;
            font-size: 14px;
        }

        .video-info {
            padding: 12px;
        }

        .video-title {
            font-size: 14px;
            margin-bottom: 10px;
            line-height: 1.4;
        }

        .video-actions {
            display: flex;
            gap: 8px;
        }

        .video-actions button {
            flex: 1;
            padding: 5px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        .play-btn {
            background-color: #00a4ff;
            color: #fff;
        }

        .delete-btn {
            background-color: #ff4757;
            color: #fff;
        }

        .video-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>
    <!-- 左侧分类栏 -->
    <div class="sidebar">
        <h2>视频分类</h2>
        <ul class="category-list">
            <li class="active" data-category="all">全部</li>
            <li data-category="tv">电视剧</li>
            <li data-category="movie">电影</li>
            <li data-category="variety">综艺</li>
            <li data-category="anime">动漫</li>
        </ul>
    </div>

    <!-- 右侧主内容区 -->
    <div class="main-content">
        <!-- 添加视频表单 -->
        <div class="add-video-form">
            <input type="text" id="videoTitle" placeholder="视频名称">
            <input type="url" id="videoUrl" placeholder="视频地址（支持.mp4/.ts/.m3u8）">
            <select id="videoCategory">
                <option value="tv">电视剧</option>
                <option value="movie">电影</option>
                <option value="variety">综艺</option>
                <option value="anime">动漫</option>
            </select>
            <button onclick="addVideo()">添加视频</button>
        </div>

        <h3 id="category-title">全部视频</h3>
        <div class="video-grid" id="video-grid"></div>
    </div>

    <script>
        // 从浏览器本地存储读取视频列表
        let videoList = JSON.parse(localStorage.getItem('myVideoList')) || [];
        let currentCategory = "all";

        // 添加视频函数
        function addVideo() {
            const title = document.getElementById('videoTitle').value.trim();
            const url = document.getElementById('videoUrl').value.trim();
            const category = document.getElementById('videoCategory').value;

            if (!title || !url) {
                alert('请填写视频名称和地址！');
                return;
            }

            // 生成唯一ID
            const id = Date.now().toString();
            videoList.push({ id, title, url, category });

            // 保存到本地存储
            localStorage.setItem('myVideoList', JSON.stringify(videoList));

            // 清空表单
            document.getElementById('videoTitle').value = '';
            document.getElementById('videoUrl').value = '';

            // 重新渲染列表
            renderVideos();
            alert('视频添加成功！');
        }

        // 删除视频函数
        function deleteVideo(id) {
            if (confirm('确定要删除这个视频吗？')) {
                videoList = videoList.filter(v => v.id !== id);
                localStorage.setItem('myVideoList', JSON.stringify(videoList));
                renderVideos();
            }
        }

        // 渲染视频列表
        function renderVideos() {
            const grid = document.getElementById("video-grid");
            grid.innerHTML = "";

            const filteredVideos = currentCategory === "all" 
                ? videoList 
                : videoList.filter(v => v.category === currentCategory);

            filteredVideos.forEach(video => {
                const card = document.createElement("div");
                card.className = "video-card";

                card.innerHTML = `
                    <div class="video-thumbnail">点击播放</div>
                    <div class="video-info">
                        <div class="video-title">${video.title}</div>
                        <div class="video-actions">
                            <button class="play-btn" onclick="playVideo('${video.url}')">播放视频</button>
                            <button class="delete-btn" onclick="deleteVideo('${video.id}')">删除</button>
                        </div>
                    </div>
                `;

                grid.appendChild(card);
            });
        }

        // 播放视频（支持m3u8）
        function playVideo(url) {
            // 创建一个新的窗口来播放视频
            const win = window.open('', '_blank');
            win.document.write(`
                <!DOCTYPE html>
                <html>
                <head>
                    <title>播放视频</title>
                    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"><\/script>
                    <style>
                        body { background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
                        video { max-width: 100%; max-height: 100%; }
                    </style>
                </head>
                <body>
                    <video controls id="videoPlayer"></video>
                    <script>
                        const video = document.getElementById('videoPlayer');
                        const url = '${url}';
                        if (Hls.isSupported()) {
                            const hls = new Hls();
                            hls.loadSource(url);
                            hls.attachMedia(video);
                            hls.on(Hls.Events.MANIFEST_PARSED, function() {
                                video.play();
                            });
                        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                            video.src = url;
                            video.addEventListener('loadedmetadata', function() {
                                video.play();
                            });
                        }
                    <\/script>
                </body>
                </html>
            `);
            win.document.close();
        }

        // 分类点击事件
        document.querySelectorAll(".category-list li").forEach(item => {
            item.addEventListener("click", function() {
                document.querySelectorAll(".category-list li").forEach(li => li.classList.remove("active"));
                this.classList.add("active");

                currentCategory = this.dataset.category;
                document.getElementById("category-title").textContent = this.textContent;
                renderVideos();
            });
        });

        // 页面加载完成后渲染
        renderVideos();
    </script>
</body>
</html>
