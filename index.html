<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的私人视频库</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:Microsoft YaHei,sans-serif;}
        body{display:flex;background:#121212;color:#eee;height:100vh;overflow:hidden;}

        /* 左侧分类 */
        .left{width:190px;background:#1e1e1e;padding:30px 0;border-right:1px solid #333;}
        .left h2{text-align:center;color:#0099ff;margin-bottom:30px;}
        .menu{list-style:none;}
        .menu li{padding:14px 25px;cursor:pointer;}
        .menu li.active,.menu li:hover{background:#292929;color:#0099ff;}

        /* 右侧主区域 */
        .right{flex:1;padding:25px;overflow-y:auto;}

        /* 添加栏 */
        .add-box{background:#1e1e1e;padding:20px;border-radius:8px;margin-bottom:25px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
        .add-box input{padding:10px;border:none;border-radius:4px;width:320px;background:#292929;color:#fff;outline:none;}
        .add-box button{padding:10px 18px;background:#0099ff;border:none;border-radius:4px;color:#fff;cursor:pointer;}

        /* 视频网格 */
        .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:20px;}
        .card{background:#1e1e1e;border-radius:8px;overflow:hidden;}
        .cover{width:100%;height:120px;background:#292929;display:flex;align-items:center;justify-content:center;color:#888;}
        .info{padding:12px;}
        .title{font-size:14px;margin-bottom:10px;line-height:1.5;}
        .btns{display:flex;gap:6px;}
        .btns button{flex:1;padding:6px;border:none;border-radius:4px;cursor:pointer;font-size:12px;}
        .play{background:#0099ff;color:#fff;}
        .del{background:#f44336;color:#fff;}
    </style>
</head>
<body>

<div class="left">
    <h2>视频分类</h2>
    <ul class="menu">
        <li class="active" data-cat="all">全部</li>
        <li data-cat="tv">电视剧</li>
        <li data-cat="movie">电影</li>
        <li data-cat="zy">综艺</li>
        <li data-cat="dm">动漫</li>
    </ul>
</div>

<div class="right">
    <div class="add-box">
        <input type="text" id="urlInput" placeholder="粘贴视频网址，自动获取标题">
        <select id="catSel" style="padding:10px;background:#292929;color:#fff;border-radius:4px;border:none;">
            <option value="tv">电视剧</option>
            <option value="movie">电影</option>
            <option value="zy">综艺</option>
            <option value="dm">动漫</option>
        </select>
        <button onclick="autoAdd()">自动添加</button>
    </div>

    <div class="grid" id="grid"></div>
</div>

<script>
let list = JSON.parse(localStorage.getItem('myVidLib')) || [];
let nowCat = 'all';

// 自动添加：粘贴链接，自动生成标题
function autoAdd(){
    let url = document.getElementById('urlInput').value.trim();
    if(!url)return alert('请先粘贴视频网址');

    // 自动从网址截取当标题
    let autoTitle = getTitleFromUrl(url);
    let cat = document.getElementById('catSel').value;

    let obj = {
        id:Date.now()+'',
        title:autoTitle,
        url:url,
        cat:cat
    };
    list.push(obj);
    localStorage.setItem('myVidLib',JSON.stringify(list));
    document.getElementById('urlInput').value='';
    render();
    alert('添加成功，自动生成标题：\n'+autoTitle);
}

// 从网址自动提取标题
function getTitleFromUrl(u){
    try{
        let path = new URL(u).pathname;
        let name = path.split('/').filter(x=>x).pop() || '未命名视频';
        return decodeURIComponent(name).replace(/[-_]/g,' ');
    }catch(e){
        return '未知视频';
    }
}

// 删除
function delVid(id){
    if(!confirm('确定删除？'))return;
    list = list.filter(item=>item.id!==id);
    localStorage.setItem('myVidLib',JSON.stringify(list));
    render();
}

// 渲染列表
function render(){
    let g = document.getElementById('grid');
    g.innerHTML='';
    let arr = nowCat==='all' ? list : list.filter(x=>x.cat===nowCat);

    arr.forEach(item=>{
        let card = document.createElement('div');
        card.className='card';
        card.innerHTML = `
            <div class="cover">默认封面</div>
            <div class="info">
                <div class="title">${item.title}</div>
                <div class="btns">
                    <button class="play" onclick="window.open('${item.url}','_blank')">播放</button>
                    <button class="del" onclick="delVid('${item.id}')">删除</button>
                </div>
            </div>
        `;
        g.appendChild(card);
    });
}

// 分类切换
document.querySelectorAll('.menu li').forEach(li=>{
    li.onclick=function(){
        document.querySelectorAll('.menu li').forEach(x=>x.classList.remove('active'));
        this.classList.add('active');
        nowCat = this.dataset.cat;
        render();
    }
});

render();
</script>

</body>
</html>
