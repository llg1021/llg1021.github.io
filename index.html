<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>私人影视基地</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }

        body {
            display: flex;
            background-color: #1a1a1a;
            color: #fff;
            height: 100vh;
        }

        /* 左侧分类栏 */
        .sidebar {
            width: 180px;
            background-color: #222;
            padding: 20px 0;
            border-right: 1px solid #333;
            display: flex;
            flex-direction: column;
        }

        .sidebar h2 {
            color: #00a4ff;
            text-align: center;
            margin-bottom: 30px;
            font-size: 20px;
        }

        .category-list {
            list-style: none;
            flex: 1;
        }

        .category-list li {
            padding: 12px 25px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .category-list li:hover,
        .category-list li.active {
            background-color: #333;
            color: #00a4ff;
        }

        /* 分类按钮 */
        .category-buttons {
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .category-buttons button {
            padding: 8px;
            border: none;
            border-radius: 4px;
            color: #fff;
            cursor: pointer;
            font-size: 14px;
        }

        .add-category-btn {
            background-color: #00a4ff;
        }
        .rename-category-btn {
            background-color: #ffa500;
        }

        /* 右侧主内容区 */
        .main-content {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
        }

        /* 添加视频表单 */
        .add-video-form {
            background-color: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 25px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .add-video-form input,
        .add-video-form select,
        .add-video-form button {
            padding: 8px 12px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            height: 38px;
        }

        /* 上传封面按钮绿色 */
        .add-video-form .upload-btn {
            background-color: #28a745;
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .add-video-form .del-mode-btn {
            background-color: #ff4757;
            color: #fff;
            cursor: pointer;
            margin-left: auto;
        }

        /* 隐藏原生文件选择框 */
        #coverFile {
            display: none;
        }

        .main-content h3 {
            margin-bottom: 20px;
            font-size: 18px;
            color: #fff;
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .video-card {
            background-color: #2a2a2a;
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.3s;
            position: relative;
            cursor: pointer;
        }

        .video-cover {
            width: 100%;
            height: 130px;
            object-fit: cover;
            background-color: #444;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #888;
            font-size: 14px;
        }

        .video-info {
            padding: 12px;
        }

        .video-title {
            font-size: 14px;
            line-height: 1.4;
        }

        .video-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        /* 批量删除勾选框 */
        .del-checkbox {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 20px;
            height: 20px;
            display: none;
        }
        .del-checkbox.show {
            display: block;
        }
    </style>
</head>
<body>
    <!-- 左侧分类栏 -->
    <div class="sidebar">
        <h2>视频分类</h2>
        <ul class="category-list" id="category-list">
            <li class="active" data-category="all">全部</li>
            <li data-category="tv">电视剧</li>
            <li data-category="movie">电影</li>
            <li data-category="variety">综艺</li>
            <li data-category="anime">动漫</li>
        </ul>

        <div class="category-buttons">
            <button class="add-category-btn" onclick="addCategory()">添加分类</button>
            <button class="rename-category-btn" onclick="renameCategory()">分类改名</button>
        </div>
    </div>

    <!-- 右侧主内容区 -->
    <div class="main-content">
        <div class="add-video-form">
            <input type="text" id="videoTitle" placeholder="视频名称">
            <input type="url" id="videoUrl" placeholder="视频地址">
            <button class="upload-btn" onclick="document.getElementById('coverFile').click()">上传封面</button>
            <input type="file" id="coverFile" accept="image/*">
            <select id="videoCategory">
                <option value="tv">电视剧</option>
                <option value="movie">电影</option>
                <option value="variety">综艺</option>
                <option value="anime">动漫</option>
            </select>
            <button class="del-mode-btn" id="delModeBtn" onclick="toggleDelMode()">批量删除</button>
        </div>

        <h3 id="category-title">全部视频</h3>
        <div class="video-grid" id="video-grid"></div>
    </div>

    <script>
        let customCategories = JSON.parse(localStorage.getItem('customCategories')) || [
            { name: "全部", key: "all" },
            { name: "电视剧", key: "tv" },
            { name: "电影", key: "movie" },
            { name: "综艺", key: "variety" },
            { name: "动漫", key: "anime" }
        ];

        let videoList = JSON.parse(localStorage.getItem('myVideoList')) || [];
        let currentCategory = "all";
        let delMode = false;

        // 防重复标记
        let isSaving = false;

        function renderCategories() {
            const list = document.getElementById('category-list');
            const select = document.getElementById('videoCategory');
            list.innerHTML = '';
            select.innerHTML = '';

            customCategories.forEach(cat => {
                if (cat.key !== 'all') {
                    const opt = document.createElement('option');
                    opt.value = cat.key;
                    opt.textContent = cat.name;
                    select.appendChild(opt);
                }

                const li = document.createElement('li');
                li.dataset.category = cat.key;
                li.textContent = cat.name;
                if (cat.key === currentCategory) li.classList.add('active');
                list.appendChild(li);
            });

            bindCategoryClicks();
        }

        function addCategory() {
            const name = prompt('输入新分类名称：');
            if (!name) return;
            const key = 'cat_' + Date.now();
            customCategories.push({ name, key });
            localStorage.setItem('customCategories', JSON.stringify(customCategories));
            renderCategories();
        }

        function renameCategory() {
            const active = document.querySelector('.category-list li.active');
            if (!active || active.dataset.category === 'all') {
                alert('请选择非“全部”的分类再改名！');
                return;
            }
            const key = active.dataset.category;
            const newName = prompt('输入新名称：', active.textContent);
            if (!newName) return;

            customCategories = customCategories.map(c => {
                if (c.key === key) c.name = newName;
                return c;
            });

            videoList = videoList.map(v => {
                if (v.category === key) v.category = key;
                return v;
            });

            localStorage.setItem('customCategories', JSON.stringify(customCategories));
            localStorage.setItem('myVideoList', JSON.stringify(videoList));
            renderCategories();
        }

        // 核心：三个条件都满足 → 自动添加
        function tryAutoAddVideo() {
            const title = document.getElementById('videoTitle').value.trim();
            const url = document.getElementById('videoUrl').value.trim();
            const coverFile = document.getElementById('coverFile').files[0];

            // 三个条件必须都有
            if (!title || !url || !coverFile) return;
            if (isSaving) return;

            isSaving = true;

            const category = document.getElementById('videoCategory').value;
            const coverUrl = URL.createObjectURL(coverFile);

            const id = Date.now().toString();
            videoList.push({ id, title, url, cover: coverUrl, category });
            localStorage.setItem('myVideoList', JSON.stringify(videoList));

            // 清空
            document.getElementById('videoTitle').value = '';
            document.getElementById('videoUrl').value = '';
            document.getElementById('coverFile').value = '';

            renderVideos();

            // 防止连续触发
            setTimeout(() => {
                isSaving = false;
            }, 800);
        }

        // 绑定事件
        document.getElementById('videoTitle').addEventListener('input', tryAutoAddVideo);
        document.getElementById('videoUrl').addEventListener('input', tryAutoAddVideo);
        document.getElementById('coverFile').addEventListener('change', tryAutoAddVideo);

        function toggleDelMode() {
            delMode = !delMode;
            document.getElementById('delModeBtn').textContent = delMode ? '确认删除' : '批量删除';
            document.querySelectorAll('.del-checkbox').forEach(cb => cb.classList.toggle('show', delMode));
            if (!delMode) deleteSelectedVideos();
        }

        function deleteSelectedVideos() {
            const checkboxes = document.querySelectorAll('.del-checkbox:checked');
            if (checkboxes.length === 0) return;
            if (!confirm('确定删除选中的视频？')) return;
            const ids = Array.from(checkboxes).map(i => i.dataset.id);
            videoList = videoList.filter(v => !ids.includes(v.id));
            localStorage.setItem('myVideoList', JSON.stringify(videoList));
            renderVideos();
        }

        function renderVideos() {
            const grid = document.getElementById('video-grid');
            grid.innerHTML = '';
            const list = currentCategory === 'all' ? videoList : videoList.filter(v => v.category === currentCategory);

            list.forEach(v => {
                const card = document.createElement('div');
                card.className = 'video-card';
                card.onclick = () => { if (!delMode) playVideo(v.url); };
                card.innerHTML = `
                    <input type="checkbox" class="del-checkbox" data-id="${v.id}">
                    <div class="video-cover" style="background:url('${v.cover}')center/cover no-repeat;"></div>
                    <div class="video-info"><div class="video-title">${v.title}</div></div>
                `;
                grid.appendChild(card);
            });
        }

        function bindCategoryClicks() {
            document.querySelectorAll('.category-list li').forEach(li => {
                li.addEventListener('click', () => {
                    document.querySelectorAll('.category-list li').forEach(i => i.classList.remove('active'));
                    li.classList.add('active');
                    currentCategory = li.dataset.category;
                    document.getElementById('category-title').textContent = li.textContent;
                    renderVideos();
                });
            });
        }

        // 播放页：倍速在三点上方
        function playVideo(url) {
            const win = window.open('', '_blank');
            win.document.write(`
                <!DOCTYPE html>
                <html>
                <head>
                    <title>播放视频</title>
                    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"><\/script>
                    <style>
                        body { margin: 0; padding: 0; background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; }
                        .video-container { position: relative; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
                        video { max-width: 100%; max-height: 100%; }
                        .speed-select {
                            position: absolute;
                            bottom: 60px;
                            right: 20px;
                            background: rgba(0, 0, 0, 0.7);
                            color: white;
                            border: none;
                            border-radius: 4px;
                            padding: 4px 8px;
                            cursor: pointer;
                            z-index: 10;
                        }
                    </style>
                </head>
                <body>
                    <div class="video-container">
                        <video id="videoPlayer" controls></video>
                        <select class="speed-select" id="speedSelect">
                            <option value="1">1x</option>
                            <option value="2" selected>2x</option>
                            <option value="3">3x</option>
                            <option value="4">4x</option>
                            <option value="5">5x</option>
                        </select>
                    </div>
                    <script>
                        const video = document.getElementById('videoPlayer');
                        const url = '${url}';
                        const speedSelect = document.getElementById('speedSelect');

                        speedSelect.addEventListener('change', () => {
                            video.playbackRate = parseFloat(speedSelect.value);
                        });

                        if (Hls.isSupported()) {
                            const hls = new Hls();
                            hls.loadSource(url);
                            hls.attachMedia(video);
                            hls.on(Hls.Events.MANIFEST_PARSED, function() {
                                video.play();
                            });
                        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                            video.src = url;
                            video.addEventListener('loadedmetadata', function() {
                                video.play();
                            });
                        }
                    <\/script>
                </body>
                </html>
            `);
            win.document.close();
        }

        renderCategories();
        renderVideos();
    </script>
</body>
</html>
