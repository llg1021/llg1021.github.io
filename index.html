<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>私人影视基地</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }

        body {
            display: flex;
            background-color: #1a1a1a;
            color: #fff;
            height: 100vh;
        }

        .sidebar {
            width: 180px;
            background-color: #222;
            padding: 20px 0;
            border-right: 1px solid #333;
            display: flex;
            flex-direction: column;
        }

        .sidebar h2 {
            color: #00a4ff;
            text-align: center;
            margin-bottom: 30px;
            font-size: 20px;
        }

        .category-list {
            list-style: none;
            flex: 1;
        }

        .category-list li {
            padding: 12px 25px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .category-list li:hover,
        .category-list li.active {
            background-color: #333;
            color: #00a4ff;
        }

        .category-buttons {
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .category-buttons button {
            padding: 8px;
            border: none;
            border-radius: 4px;
            color: #fff;
            cursor: pointer;
            font-size: 14px;
        }

        .add-category-btn {
            background-color: #00a4ff;
        }
        .rename-category-btn {
            background-color: #ffa500;
        }

        .main-content {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
        }

        .add-video-form {
            background-color: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 25px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .add-video-form input,
        .add-video-form select,
        .add-video-form button {
            padding: 8px 12px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            height: 38px;
        }

        .upload-btn {
            background-color: #28a745;
            color: #fff;
            cursor: pointer;
        }
        .del-mode-btn {
            background-color: #ff4757;
            color: #fff;
            cursor: pointer;
            margin-left: auto;
        }

        #coverFile {
            display: none;
        }

        .main-content h3 {
            margin-bottom: 20px;
            font-size: 18px;
            color: #fff;
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .video-card {
            position: relative;
            cursor: pointer;
        }

        /* 只给封面加氛围灯！ */
        .video-cover {
            width: 100%;
            height: 130px;
            border-radius: 8px;
            background-color: #444;
            background-size: cover;
            background-position: center;
            transition: all 0.3s ease;
            position: relative;
        }

        /* 选中 → 只在封面显示红色氛围灯 */
        .video-card.selected .video-cover {
            box-shadow: 0 0 0 2px #ff2222, 0 0 12px #ff3333, 0 0 20px rgba(255,51,51,0.6);
        }

        .video-title {
            text-align: center;
            margin-top: 8px;
            font-size: 14px;
            color: #fff;
            padding: 0 5px;
        }

        .del-checkbox {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>视频分类</h2>
        <ul class="category-list" id="category-list">
            <li class="active" data-category="all">全部</li>
            <li data-category="tv">电视剧</li>
            <li data-category="movie">电影</li>
            <li data-category="variety">综艺</li>
            <li data-category="anime">动漫</li>
        </ul>
        <div class="category-buttons">
            <button class="add-category-btn" onclick="addCategory()">添加分类</button>
            <button class="rename-category-btn" onclick="renameCategory()">分类改名</button>
        </div>
    </div>

    <div class="main-content">
        <div class="add-video-form">
            <input type="text" id="videoTitle" placeholder="视频名称">
            <input type="url" id="videoUrl" placeholder="视频地址">
            <button class="upload-btn" onclick="document.getElementById('coverFile').click()">上传封面</button>
            <input type="file" id="coverFile" accept="image/*">
            <select id="videoCategory">
                <option value="tv">电视剧</option>
                <option value="movie">电影</option>
                <option value="variety">综艺</option>
                <option value="anime">动漫</option>
            </select>
            <button class="del-mode-btn" id="delModeBtn" onclick="toggleDelMode()">批量删除</button>
        </div>
        <h3 id="category-title">全部视频</h3>
        <div class="video-grid" id="video-grid"></div>
    </div>

    <script>
        let customCategories = JSON.parse(localStorage.getItem('customCategories')) || [
            { name: "全部", key: "all" },
            { name: "电视剧", key: "tv" },
            { name: "电影", key: "movie" },
            { name: "综艺", key: "variety" },
            { name: "动漫", key: "anime" }
        ];
        let videoList = JSON.parse(localStorage.getItem('myVideoList')) || [];
        let currentCategory = "all";
        let delMode = false;
        let isSaving = false;
        let selectDelIds = [];

        function renderCategories() {
            const list = document.getElementById('category-list');
            const select = document.getElementById('videoCategory');
            list.innerHTML = '';
            select.innerHTML = '';
            customCategories.forEach(cat => {
                if(cat.key !== 'all'){
                    let opt = document.createElement('option');
                    opt.value = cat.key;
                    opt.textContent = cat.name;
                    select.appendChild(opt);
                }
                let li = document.createElement('li');
                li.dataset.category = cat.key;
                li.textContent = cat.name;
                if(cat.key === currentCategory) li.classList.add('active');
                list.appendChild(li);
            });
            bindCategoryClicks();
        }

        function addCategory(){
            let name = prompt("输入新分类名");
            if(!name)return;
            let key = "cat_"+Date.now();
            customCategories.push({name,key});
            localStorage.setItem('customCategories',JSON.stringify(customCategories));
            renderCategories();
        }

        function renameCategory(){
            let active = document.querySelector('.category-list li.active');
            if(!active||active.dataset.category==="all")return alert("不能修改全部");
            let key = active.dataset.category;
            let newName = prompt("修改名称",active.textContent);
            if(!newName)return;
            customCategories = customCategories.map(c=>c.key===key?{...c,name:newName}:c);
            localStorage.setItem('customCategories',JSON.stringify(customCategories));
            renderVideos();
        }

        function fileToBase64(file){
            return new Promise(resolve=>{
                let reader = new FileReader();
                reader.onload=()=>resolve(reader.result);
                reader.readAsDataURL(file);
            })
        }

        async function tryAutoAddVideo(){
            let title = document.getElementById('videoTitle').value.trim();
            let url = document.getElementById('videoUrl').value.trim();
            let file = document.getElementById('coverFile').files[0];
            if(!title||!url||!file||isSaving)return;
            isSaving=true;
            let base64 = await fileToBase64(file);
            let cate = document.getElementById('videoCategory').value;
            videoList.push({id:Date.now()+"",title,url,cover:base64,category:cate});
            localStorage.setItem('myVideoList',JSON.stringify(videoList));
            document.getElementById('videoTitle').value="";
            document.getElementById('videoUrl').value="";
            document.getElementById('coverFile').value="";
            renderVideos();
            setTimeout(()=>isSaving=false,800);
        }

        document.getElementById('videoTitle').addEventListener('input',tryAutoAddVideo);
        document.getElementById('videoUrl').addEventListener('input',tryAutoAddVideo);
        document.getElementById('coverFile').addEventListener('change',tryAutoAddVideo);

        function toggleDelMode(){
            delMode=!delMode;
            document.getElementById('delModeBtn').textContent=delMode?"确认删除":"批量删除";
            if(!delMode){
                videoList = videoList.filter(v=>!selectDelIds.includes(v.id));
                localStorage.setItem('myVideoList',JSON.stringify(videoList));
                selectDelIds = [];
            }
            renderVideos();
        }

        function toggleSelectVideo(id,dom){
            if(!delMode) return;
            if(selectDelIds.includes(id)){
                selectDelIds = selectDelIds.filter(i=>i!==id);
                dom.classList.remove('selected');
            }else{
                selectDelIds.push(id);
                dom.classList.add('selected');
            }
        }

        function renderVideos(){
            let grid = document.getElementById('video-grid');
            grid.innerHTML="";
            let arr = currentCategory==="all"?videoList:videoList.filter(v=>v.category===currentCategory);
            arr.forEach(v=>{
                let div = document.createElement('div');
                div.className="video-card";
                if(selectDelIds.includes(v.id)) div.classList.add('selected');
                div.onclick = ()=>{
                    delMode ? toggleSelectVideo(v.id,div) : playVideo(v.url);
                };
                div.innerHTML=`
                    <div class="video-cover" style="background-image:url(${v.cover})"></div>
                    <div class="video-title">${v.title}</div>
                `;
                grid.appendChild(div);
            })
        }

        function bindCategoryClicks(){
            document.querySelectorAll('.category-list li').forEach(li=>{
                li.onclick=()=>{
                    document.querySelectorAll('.category-list li').forEach(i=>i.classList.remove('active'));
                    li.classList.add('active');
                    currentCategory=li.dataset.category;
                    document.getElementById('category-title').textContent=li.textContent;
                    renderVideos();
                }
            })
        }

        function playVideo(url){
            let win = window.open('','_blank');
            win.document.write(`
            <!DOCTYPE html>
            <html>
            <head>
                <meta charset="UTF-8">
                <title>播放</title>
                <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"><\/script>
                <style>
                    body{margin:0;background:#000;height:100vh;display:flex;align-items:center;justify-content:center;}
                    video{max-width:100%;max-height:100vh;}
                </style>
            </head>
            <body>
                <video id="v" autoplay controls controlsList="noplaybackrate nodownload"></video>
                <script>
                    let v=document.getElementById('v');
                    let u='${url}';
                    if(Hls.isSupported()){
                        let h=new Hls();
                        h.loadSource(u);
                        h.attachMedia(v);
                    }else{v.src=u;}
                    v.play();
                <\/script>
            </body>
            </html>
            `)
            win.document.close();
        }

        renderCategories();
        renderVideos();
    </script>
</body>
</html>
